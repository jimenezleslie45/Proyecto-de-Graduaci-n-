version: '3.8'

services:
  # SQL Server Database
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hotel-mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=HotelAuto2024!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P HotelAuto2024! -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend API
  backend:
    build:
      context: ../backend-api
      dockerfile: Dockerfile.node
    container_name: hotel-backend
    environment:
      - PORT=3000
      - DB_SERVER=mssql
      - DB_PORT=1433
      - DB_NAME=HotelAutomation
      - DB_USER=sa
      - DB_PASSWORD=HotelAuto2024!
      - JWT_SECRET=your_jwt_secret_key_change_in_production
    ports:
      - "3000:3000"
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ../backend-api:/app
      - /app/node_modules

  # Python Analytics Backend
  analytics:
    build:
      context: ../backend-analytics
      dockerfile: Dockerfile.python
    container_name: hotel-analytics
    environment:
      - PORT=5000
      - DB_SERVER=mssql
      - DB_PORT=1433
      - DB_NAME=HotelAutomation
      - DB_USER=sa
      - DB_PASSWORD=HotelAuto2024!
      - NODE_API_URL=http://backend:3000
    ports:
      - "5000:5000"
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ../backend-analytics:/app
      - ../reports:/app/reports

  # React Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.react
    container_name: hotel-frontend
    environment:
      - VITE_API_URL=http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  mssql_data:
